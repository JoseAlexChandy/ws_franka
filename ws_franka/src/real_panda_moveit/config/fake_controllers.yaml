controller_list:
  - name: fake_bob_arm_controller
    type: $(arg fake_execution_type)
    joints:
      - bob_joint1
      - bob_joint2
      - bob_joint3
      - bob_joint4
      - bob_joint5
      - bob_joint6
      - bob_joint7
  - name: fake_hand_controller
    type: $(arg fake_execution_type)
    joints:
      - bob_finger_joint1
initial:  # Define initial robot poses per group
  - group: bob_arm
    pose: default